          exit 0

      - name: Upload DBOS lifecycle qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbos-formal-lifecycle-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/naia-dbos-lifecycle-receipt/
          if-no-files-found: warn
          retention-days: 30
