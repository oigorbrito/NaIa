name: Research Chassis Restate T11 Runtime Qualification

on:
  push:
    branches:
      - research/qualified-chassis-gate-v1
    paths:
      - '.github/workflows/research-chassis-restate-t11-runtime.yml'
      - 'research/chassis/adapters/restate-ts/t11-*.mjs'
      - 'research/chassis/adapters/restate-ts/package.json'
      - 'research/chassis/harness/t11-evaluator.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restate-t11-runtime-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RESTATE_VERSION: '1.7.8'
      RESTATE_SERVER_ARCHIVE: 'restate-server-x86_64-unknown-linux-musl.tar.xz'
      RESTATE_SERVER_SHA256: 'e527f20b8788564a9bb90effedb7cb82b0e36d72f025011e89de465d675d8e33'
      RESTATE_ADMIN_URL: 'http://127.0.0.1:9070'
      RESTATE_INGRESS_URL: 'http://127.0.0.1:8080'
      NAIA_T11_TIMEOUT_MS: '30000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
          cache-dependency-path: research/chassis/adapters/restate-ts/package.json

      - name: Initialize isolated qualification workspace
        shell: bash
        run: |
          set -euo pipefail
          QUAL_DIR="$RUNNER_TEMP/naia-restate-t11-runtime"
          rm -rf "$QUAL_DIR"
          mkdir -p "$QUAL_DIR/bin" "$QUAL_DIR/server-work" "$QUAL_DIR/evidence"
          echo "QUAL_DIR=$QUAL_DIR" >> "$GITHUB_ENV"
          {
            echo "classification=NOT_RUN"
            echo "head_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "restate_server_version=$RESTATE_VERSION"
            echo "restate_server_archive=$RESTATE_SERVER_ARCHIVE"
            echo "restate_server_expected_sha256=$RESTATE_SERVER_SHA256"
          } > "$QUAL_DIR/evidence/runtime-manifest.txt"
          if pgrep -af 't11-service-process.mjs|restate-server' > "$QUAL_DIR/evidence/pre-run-processes.txt"; then
            echo 'preexisting_processes=true' >> "$QUAL_DIR/evidence/runtime-manifest.txt"
            echo 'BLOCKED_PRE_RUN_PROCESS_CONTAMINATION' > "$QUAL_DIR/evidence/classification.txt"
            exit 1
          else
            echo 'preexisting_processes=false' >> "$QUAL_DIR/evidence/runtime-manifest.txt"
          fi

      - name: Install exact Restate TypeScript SDK dependencies
        id: npm_install
        continue-on-error: true
        working-directory: research/chassis/adapters/restate-ts
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm ls --all --json > "$QUAL_DIR/evidence/npm-tree.json"
          cp package-lock.json "$QUAL_DIR/evidence/package-lock.runtime.json"
          node -e "for (const p of ['@restatedev/restate-sdk','@restatedev/restate-sdk-clients']) { const j=require('./node_modules/'+p+'/package.json'); console.log(p+'='+j.version); if (j.version !== '1.16.9') process.exitCode=2 }" | tee "$QUAL_DIR/evidence/sdk-versions.txt"

      - name: Download and verify exact Restate server
        id: server_download
        if: steps.npm_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUAL_DIR/bin"
          URL="https://github.com/restatedev/restate/releases/download/v${RESTATE_VERSION}/${RESTATE_SERVER_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "$RESTATE_SERVER_ARCHIVE" "$URL"
          printf '%s  %s\n' "$RESTATE_SERVER_SHA256" "$RESTATE_SERVER_ARCHIVE" | sha256sum --check --strict | tee "$QUAL_DIR/evidence/server-checksum.txt"
          tar -xJf "$RESTATE_SERVER_ARCHIVE" --strip-components=1 "restate-server-x86_64-unknown-linux-musl/restate-server"
          chmod +x restate-server
          ./restate-server --version | tee "$QUAL_DIR/evidence/server-version.txt"

      - name: Start isolated Restate server
        id: server_start
        if: steps.npm_install.outcome == 'success' && steps.server_download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUAL_DIR/server-work"
          "$QUAL_DIR/bin/restate-server" --no-logo > "$QUAL_DIR/evidence/restate-server.log" 2>&1 &
          echo $! > "$QUAL_DIR/evidence/restate-server.pid"
          for i in $(seq 1 120); do
            if curl --fail --silent --show-error "$RESTATE_ADMIN_URL/health" > "$QUAL_DIR/evidence/admin-health.txt" 2> "$QUAL_DIR/evidence/admin-health.err"; then
              exit 0
            fi
            if curl --fail --silent --show-error "$RESTATE_ADMIN_URL" > "$QUAL_DIR/evidence/admin-root.txt" 2> "$QUAL_DIR/evidence/admin-root.err"; then
              exit 0
            fi
            if ! kill -0 "$(cat "$QUAL_DIR/evidence/restate-server.pid")" 2>/dev/null; then
              echo 'restate-server exited before becoming reachable' >&2
              tail -200 "$QUAL_DIR/evidence/restate-server.log" >&2 || true
              exit 2
            fi
            sleep 0.5
          done
          echo 'restate-server did not become reachable on admin port' >&2
          tail -200 "$QUAL_DIR/evidence/restate-server.log" >&2 || true
          exit 3

      - name: Execute controlled local T11 runtime driver
        id: t11_driver
        if: steps.npm_install.outcome == 'success' && steps.server_download.outcome == 'success' && steps.server_start.outcome == 'success'
        continue-on-error: true
        working-directory: research/chassis/adapters/restate-ts
        shell: bash
        run: |
          set +e
          node t11-driver.mjs --output "$QUAL_DIR/evidence/t11-evidence.json" > "$QUAL_DIR/evidence/t11-driver.stdout.log" 2> "$QUAL_DIR/evidence/t11-driver.stderr.log"
          CODE=$?
          echo "$CODE" > "$QUAL_DIR/evidence/t11-driver.exit-code.txt"
          exit "$CODE"

      - name: Evaluate emitted T11 evidence
        id: evaluate
        if: always() && steps.t11_driver.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$QUAL_DIR/evidence/t11-evidence.json" ]; then
            echo 'No T11 evidence file was emitted.' >&2
            exit 4
          fi
          node --input-type=module - "$QUAL_DIR/evidence/t11-evidence.json" "$QUAL_DIR/evidence/t11-evaluation.json" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { evaluateT11Evidence } from './research/chassis/harness/t11-evaluator.mjs';
          const [input, output] = process.argv.slice(2);
          const evidence = JSON.parse(await readFile(input, 'utf8'));
          const evaluation = evaluateT11Evidence(evidence);
          await writeFile(output, JSON.stringify(evaluation, null, 2) + '\n');
          console.log(JSON.stringify(evaluation, null, 2));
          if (evaluation.verdict !== 'PASS') process.exitCode = 5;
          NODE

      - name: Classify qualification outcome without conflating infrastructure and candidate behavior
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CLASSIFICATION='INCONCLUSIVE'
          if [ '${{ steps.npm_install.outcome }}' != 'success' ]; then
            CLASSIFICATION='BLOCKED_INFRASTRUCTURE_NPM'
          elif [ '${{ steps.server_download.outcome }}' != 'success' ]; then
            CLASSIFICATION='BLOCKED_INFRASTRUCTURE_SERVER_ARTIFACT'
          elif [ '${{ steps.server_start.outcome }}' != 'success' ]; then
            CLASSIFICATION='BLOCKED_INFRASTRUCTURE_SERVER_START'
          elif [ '${{ steps.t11_driver.outcome }}' != 'success' ]; then
            CLASSIFICATION='INCONCLUSIVE_DRIVER_NO_PASS_EVIDENCE'
          elif [ '${{ steps.evaluate.outcome }}' == 'success' ]; then
            CLASSIFICATION='QUALIFICATION_PASS'
          else
            CLASSIFICATION='QUALIFICATION_FAIL'
          fi
          echo "$CLASSIFICATION" | tee "$QUAL_DIR/evidence/classification.txt"
          echo "classification=$CLASSIFICATION" >> "$QUAL_DIR/evidence/runtime-manifest.txt"
          {
            echo "npm_install=${{ steps.npm_install.outcome }}"
            echo "server_download=${{ steps.server_download.outcome }}"
            echo "server_start=${{ steps.server_start.outcome }}"
            echo "t11_driver=${{ steps.t11_driver.outcome }}"
            echo "evaluate=${{ steps.evaluate.outcome }}"
          } >> "$QUAL_DIR/evidence/runtime-manifest.txt"

      - name: Verify and record cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$QUAL_DIR/evidence/restate-server.pid" ]; then
            PID=$(cat "$QUAL_DIR/evidence/restate-server.pid")
            kill "$PID" 2>/dev/null || true
            for i in $(seq 1 20); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 0.25
            done
            kill -9 "$PID" 2>/dev/null || true
          fi
          pkill -f 't11-service-process.mjs' 2>/dev/null || true
          sleep 0.5
          {
            echo 'worker_processes_after_cleanup:'
            pgrep -af 't11-service-process.mjs' || true
            echo 'restate_server_after_cleanup:'
            pgrep -af 'restate-server' || true
          } > "$QUAL_DIR/evidence/post-run-processes.txt"
          if pgrep -af 't11-service-process.mjs|restate-server' > /dev/null; then
            echo 'cleanup_status=FAIL' | tee "$QUAL_DIR/evidence/cleanup.txt"
          else
            echo 'cleanup_status=PASS' | tee "$QUAL_DIR/evidence/cleanup.txt"
          fi
          echo "server_work_bytes=$(du -sb "$QUAL_DIR/server-work" 2>/dev/null | awk '{print $1}')" >> "$QUAL_DIR/evidence/cleanup.txt"

      - name: Upload raw qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restate-t11-runtime-qualification-${{ github.sha }}
          path: ${{ env.QUAL_DIR }}/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Report qualification classification
        if: always()
        shell: bash
        run: |
          if [ -f "$QUAL_DIR/evidence/classification.txt" ]; then
            CLASSIFICATION=$(cat "$QUAL_DIR/evidence/classification.txt")
          else
            CLASSIFICATION='INCONCLUSIVE_NO_CLASSIFICATION'
          fi
          echo "### Restate T11 runtime qualification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: \`$CLASSIFICATION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate: Restate server 1.7.8 / SDK 1.16.9" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: controlled local fault-injection on an ephemeral GitHub runner" >> "$GITHUB_STEP_SUMMARY"
          echo "- This is qualification evidence, not formal benchmark promotion." >> "$GITHUB_STEP_SUMMARY"
