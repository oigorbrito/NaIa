  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-pid-provenance-structural-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify formal provenance, neutral evaluators, candidate profile, environment, worker PID cleanup and promotion gates
        shell: bash
        run: |
          set -euo pipefail
          echo 'scope=CHASSIS_ONLY'
          echo 'harness=LOCAL TEST HARNESS'
          echo 'repository=OWN REPOSITORY'
          echo 'fault_injection=CONTROLLED FAULT INJECTION'
          echo 'third_party_target=NO THIRD-PARTY TARGET'
          echo 'credential_bypass=NO CREDENTIAL BYPASS'
          echo 'real_world_disruption=NO REAL-WORLD SERVICE DISRUPTION'
          node --test \
            research/chassis/harness/experiment-protocol-validator.test.mjs \
            research/chassis/harness/harness-provenance.test.mjs \
            research/chassis/harness/repository-provenance.test.mjs \
            research/chassis/harness/formal-candidate-profile-binding.test.mjs \
            research/chassis/harness/formal-environment-identity.test.mjs \
            research/chassis/harness/t7-t8-evaluator.test.mjs \
            research/chassis/harness/critical-evaluator-neutrality.test.mjs \
            research/chassis/harness/isolated-external-fault-runner.test.mjs \
            research/chassis/harness/formal-cleanup-support.test.mjs \
            research/chassis/harness/formal-lifecycle-qualification-provenance.test.mjs \
            research/chassis/harness/formal-worker-pid-provenance.test.mjs \
            research/chassis/harness/formal-runtime-lifecycle.test.mjs \
            research/chassis/harness/formal-dbos-lifecycle.test.mjs \
            research/chassis/harness/formal-single-run.test.mjs \
            research/chassis/harness/common-runner-record-bridge.test.mjs \
            research/chassis/harness/t5-record-bridge.test.mjs \
            research/chassis/harness/t11-record-bridge.test.mjs \
            research/chassis/harness/t12-record-bridge.test.mjs \
            research/chassis/harness/t16-record-bridge.test.mjs \
            research/chassis/harness/formal-lifecycle-runtime-receipt-validator.test.mjs \
            research/chassis/harness/formal-lifecycle-promotion-review.test.mjs \
            research/chassis/harness/formal-ledger-admission.test.mjs \
            research/chassis/harness/formal-ledger-revision-consistency.test.mjs \
            research/chassis/harness/formal-ledger-environment-consistency.test.mjs \
            research/chassis/harness/experiment-ledger-validator.test.mjs \
            research/chassis/harness/experiment-record-validator.test.mjs \
            research/chassis/harness/benchmark-execution-readiness.test.mjs \
            research/chassis/harness/benchmark-promotion-gate.test.mjs \
            research/chassis/harness/benchmark-revision-consistency.test.mjs
