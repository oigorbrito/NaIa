name: Capability Layer Diagnostic

on:
  push:
    branches:
      - product/mvp-capability-layer-v2

jobs:
  capture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture npm test output
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          echo "exit_code=$code" > test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: capability-layer-test-output
          path: |
            test-output.txt
            test-status.txt
